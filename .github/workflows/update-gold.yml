name: Update gold data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gold
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CCB gold data
        shell: pwsh
        run: ./scripts/fetch_gold.ps1

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold.json
          $diff = git diff --staged --name-only
          if ([string]::IsNullOrWhiteSpace($diff)) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "chore: update gold data"
            git push
          }
