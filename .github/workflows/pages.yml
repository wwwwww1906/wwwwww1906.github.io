# GitHub Pages 经 Actions 部署：构建时把 Secrets.PAYLOAD_PROXY_TOKEN
# 注入 index.html 占位符 __PAYLOAD_PROXY_TOKEN__，源码和页面都不出现真实 Token。
name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject proxy token
        env:
          TOKEN: ${{ secrets.PAYLOAD_PROXY_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, pathlib
          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert '__PAYLOAD_PROXY_TOKEN__' in s, 'token placeholder missing'
          p.write_text(s.replace('__PAYLOAD_PROXY_TOKEN__', os.environ['TOKEN']), encoding='utf-8')
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
